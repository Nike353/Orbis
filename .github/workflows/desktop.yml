name: Build Orbis desktop previews
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test:desktop && npm run test:python
      - name: Export an empty-library application
        run: |
          python scripts/package_release.py --output "$RUNNER_TEMP/orbis-source.zip"
          python -m zipfile -e "$RUNNER_TEMP/orbis-source.zip" "$RUNNER_TEMP/orbis-build"
      - run: npm ci && node node_modules/electron/install.js
        working-directory: ${{ runner.temp }}/orbis-build/orbis
      - run: npm run desktop:build
        working-directory: ${{ runner.temp }}/orbis-build/orbis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-desktop-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/orbis-build/orbis/release/desktop/*.dmg
            ${{ runner.temp }}/orbis-build/orbis/release/desktop/*.zip
            ${{ runner.temp }}/orbis-build/orbis/release/desktop/*.AppImage
            ${{ runner.temp }}/orbis-build/orbis/release/desktop/*.deb
